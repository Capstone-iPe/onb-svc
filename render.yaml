databases:
  - name: onb-db
    plan: free
    databaseName: onb
    ipAllowList: []

services:
  - type: web
    name: onb
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install --upgrade --force-reinstall --no-deps .
    startCommand: python -m onb
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GOOGLE_ENFORCE_ALLOWED_EMAILS
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: onb-db
          property: connectionString
      - key: CHAT_BASE_URL
        value: https://103.42.50.41:1032/v1
      - key: CHAT_MODEL
        value: Qwen/Qwen3-8B
      - key: CHAT_API_KEY
        sync: false
      - key: CORPUS_SEARCH_URL
        value: https://onb-corpus.onrender.com
      - key: CORPUS_API_KEY
        sync: false
