databases:
  - name: onb-db
    plan: free
    databaseName: onb
    ipAllowList: []

services:
  - type: web
    name: onb
    runtime: python
    plan: free
    buildCommand: pip install --upgrade --force-reinstall --no-deps . && pip install .
    startCommand: python -m onb
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: onb-db
          property: connectionString
