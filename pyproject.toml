[project]
name = "onb"
version = "0.0.1"
description = "iPe onboarding rules. Deterministic Python, no model."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "psycopg[binary]>=3.2",
    "pypdf>=4.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
onb = "onb.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
